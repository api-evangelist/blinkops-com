  /workspace/{wsId}/playbooks/{id}/execute:
    post:
      operationId: post_workspace_wsId_playbooks_id_execute
      tags:
      - Workspace
      summary: Execute a playbook
      description: 'Starts execution of the specified playbook. By default, the execution runs asynchronously and returns the execution ID immediately.
        Use the `run_sync` parameter to wait for the execution to complete and return the output directly. **Note**: When running synchronously,
        the request will block until the playbook completes or times out.'
      x-source: https://docs.blinkops.com/docs/api/workflows/execute-a-playbook.md
      parameters:
      - name: wsId
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: run_sync
        in: query
        required: false
        schema:
          type: string
        description: When set to true, runs the playbook synchronously and returns the execution output instead of the execution ID. The request
          blocks until the workflow completes or times out
      - name: timeout
        in: query
        required: false
        schema:
          type: string
        description: The number of seconds to wait for completion when running synchronously. Only applicable when `run_sync` is true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostWorkspaceWsidPlaybooksIdExecuteRequest'
      responses:
        '200':
          description: Success (status as documented)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostWorkspaceWsidPlaybooksIdExecuteResponse'
      x-evidence:
        kind: documentation
